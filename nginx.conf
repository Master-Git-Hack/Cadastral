user  www-data;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    server {
        listen 80;
        server_name _;

        # Servir archivos estáticos de Next.js directamente
        location /_next/static/ {
            alias /app/frontend/.next/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Servir archivos públicos
        location /public/ {
            alias /app/frontend/public/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Favicon y otros archivos en public
        location ~ ^/(favicon\.ico|robots\.txt|sitemap\.xml)$ {
            root /app/frontend/public;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # Reverse proxy to FastAPI backend
        location /api/py/ {
            proxy_pass http://127.0.0.1:5000/api/py/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Docs
        location /docs {
            proxy_pass http://127.0.0.1:5000/api/py/docs;
        }

        # OpenAPI JSON
        location /openapi.json {
            proxy_pass http://127.0.0.1:5000/api/py/openapi.json;
        }

        # Todo lo demás va a Next.js
        location / {
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
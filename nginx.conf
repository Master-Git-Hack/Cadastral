# Serve Next.js app from a port through NGINX reverse proxy (HTTP)
# Path: /etc/nginx/sites-available/default

server {
    # server_name www.DOMAINNAME.com DOMAINNAME.com;  # Uncomment and change if necessary

    # Serve static assets from the Next.js app
    location /_next/static/ {
        alias /home/ubuntu/PROJECT_FOLDER/.next/static;
        add_header Cache-Control "public, max-age=3600, immutable";
    }

    # Serve static files (like HTML, CSS, JS) and fallback to Next.js for dynamic routes
    location / {
        try_files $uri $uri/ @nextjs;  # If file isn't found, send the request to @nextjs
        add_header Cache-Control "public, max-age=3600";
    }

    # Handle proxying for dynamic Next.js routes
    location @nextjs {
        proxy_pass http://localhost:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # Listen on port 80 (standard HTTP port)
    listen 80 default_server;
    listen [::]:80;

    # Optionally, handle the error pages
    error_page 404 /404.html;
    location = /404.html {
        root /usr/share/nginx/html;
        internal;
    }
}

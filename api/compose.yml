services:
  backend:
    container_name: backend_v3
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - ../.env
    environment:
      - PYTHONUNBUFFERED=1
      - ENV=production
    volumes:
      - .:/app
    ports:
      - "5000:5000"
    networks:
      - cadastral_network

